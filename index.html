.sb-section{padding:10px 10px 4px}.sb-label{font-family:'JetBrains Mono',monospace;font-size:8px;color:var(--text3);letter-spacing:0.1em;text-transform:uppercase;padding:0 8px;margin-bottom:4px}
.sb-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:var(--radius-sm);cursor:pointer;font-size:12px;font-weight:400;color:var(--text2);transition:all 0.12s;border:none;background:none;width:100%;text-align:left}
.sb-item:hover{background:var(--bg3);color:var(--text)}.sb-item.active{background:var(--accent);color:#fff}
.sb-item .ic{font-size:13px;width:16px;text-align:center;flex-shrink:0}
.sb-balances{margin-top:auto;padding:12px 14px 14px;border-top:1px solid var(--border)}
.sb-bal-label{font-family:'JetBrains Mono',monospace;font-size:8px;color:var(--text3);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:8px}
.sb-bal-row{display:flex;align-items:center;gap:7px;padding:4px 0;font-size:11px}
.sb-bal-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}.sb-bal-name{color:var(--text2);flex:1}
.sb-bal-val{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:500}
.sb-total-row{display:flex;justify-content:space-between;margin-top:6px;padding-top:6px;border-top:1px solid var(--border);font-size:11px}
.sb-total-val{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:500;color:var(--green)}
.page{display:none;padding:28px 32px;min-height:100%;animation:fadeIn 0.18s ease}.page.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.ph{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:24px}
.ph h1{font-size:22px;font-weight:500;letter-spacing:-0.02em}.ph h1 span{color:var(--accent)}
.ph-sub{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text3);margin-top:3px}
.ph-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:10px;margin-bottom:20px}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:15px 17px;transition:border-color 0.12s}.card:hover{border-color:var(--border2)}
.card-label{font-family:'JetBrains Mono',monospace;font-size:8.5px;color:var(--text3);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:8px}
.card-val{font-size:20px;font-weight:300;line-height:1;letter-spacing:-0.03em;font-family:'JetBrains Mono',monospace}
.card-val.neg{color:var(--red)}.card-val.pos{color:var(--green)}.card-val.gold{color:var(--gold)}.card-val.blue{color:var(--blue)}
.card-sub{font-size:10px;color:var(--text3);margin-top:5px}.card.accent{border-color:var(--accent)}
.acct-grid{display:grid;gap:10px;margin-bottom:20px}
.acct-card{border-radius:var(--radius);padding:18px 20px;position:relative;overflow:hidden;cursor:pointer;transition:transform 0.15s,box-shadow 0.15s}.acct-card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,0.4)}

.acct-name{font-size:8.5px;font-family:'JetBrains Mono',monospace;letter-spacing:0.1em;opacity:0.45;margin-bottom:8px;text-transform:uppercase}
.acct-bal{font-size:24px;font-weight:300;letter-spacing:-0.03em;font-family:'JetBrains Mono',monospace}
.acct-role{font-size:9.5px;opacity:0.4;margin-top:5px}.acct-edit{font-size:9px;opacity:0.3;margin-top:6px;cursor:pointer;text-decoration:underline}
.chart-wrap{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:17px;margin-bottom:14px}
.chart-title{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:13px}
.charts-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.h160{position:relative;height:160px}.h200{position:relative;height:200px}.h240{position:relative;height:240px}.h280{position:relative;height:280px}
.tbl-wrap{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:14px}
.tbl-head{padding:11px 15px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.tbl-title{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em}
.tbl-scroll{overflow-x:auto;max-height:420px;overflow-y:auto}
table{width:100%;border-collapse:collapse;font-size:11.5px}
thead th{padding:9px 12px;text-align:left;font-family:'JetBrains Mono',monospace;font-size:8.5px;color:var(--text3);text-transform:uppercase;letter-spacing:0.07em;background:var(--bg3);position:sticky;top:0;white-space:nowrap;border-bottom:1px solid var(--border)}
tbody tr{border-bottom:1px solid var(--border2);transition:background 0.08s}tbody tr:hover{background:var(--bg3)}tbody tr:last-child{border-bottom:none}
td{padding:8px 12px;color:var(--text2);vertical-align:middle}td.mono{font-family:'JetBrains Mono',monospace;font-size:10.5px}
td.pos{color:var(--green);font-family:'JetBrains Mono',monospace;font-size:11px;text-align:right;white-space:nowrap}
td.neg{color:var(--red);font-family:'JetBrains Mono',monospace;font-size:11px;text-align:right;white-space:nowrap}
td.tr-amt{color:var(--blue);font-family:'JetBrains Mono',monospace;font-size:11px;text-align:right;white-space:nowrap}
.pill{display:inline-block;padding:2px 7px;border-radius:8px;font-size:9.5px;font-family:'JetBrains Mono',monospace;background:var(--bg4);color:var(--text3)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input,select{background:var(--bg3);border:1px solid var(--border);color:var(--text);border-radius:var(--radius-sm);padding:7px 10px;font-size:12px;font-family:'Space Grotesk',sans-serif;outline:none;transition:border 0.12s}

.btn{padding:7px 14px;border-radius:var(--radius-sm);font-size:11.5px;font-family:'Space Grotesk',sans-serif;font-weight:500;cursor:pointer;border:none;transition:all 0.12s;display:inline-flex;align-items:center;gap:5px}
.btn-accent{background:var(--accent);color:#fff}.btn-accent:hover{opacity:0.85}

.form-label{font-family:'JetBrains Mono',monospace;font-size:8.5px;color:var(--text3);text-transform:uppercase;letter-spacing:0.07em;margin-bottom:3px;display:block}

// ── CONSTANTS ──
const MN = {'01':'Jan','02':'Feb','03':'Mar','04':'Apr','05':'May','06':'Jun','07':'Jul','08':'Aug','09':'Sep','10':'Oct','11':'Nov','12':'Dec'};
const CAT_COLORS = ['#7c6af5','#22c55e','#ef4444','#f59e0b','#3b82f6','#8b5cf6','#f97316','#14b8a6','#ec4899','#06b6d4','#84cc16','#6366f1'];
const ACCT_GRADIENTS = {'HDFC':'linear-gradient(135deg,#7b0f0a,#c0392b)','Kotak 811':'linear-gradient(135deg,#006d7a,#00bcd4)','Slice':'linear-gradient(135deg,#8b0050,#e91e8c)'};
const ACCT_COLORS_MAP = {'HDFC':'#e03030','Kotak 811':'#06b6d4','Slice':'#ec4899'};

// ── HELPERS ──
const fmt = v => '₹' + Math.abs(v).toLocaleString('en-IN',{minimumFractionDigits:0,maximumFractionDigits:0});
const fmtD = v => '₹' + Math.abs(v).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const nt = () => TX.filter(t=>!t.transfer);
const exp = (arr) => (arr||nt()).filter(t=>t.type==='Expenses');
const inc = (arr) => (arr||nt()).filter(t=>t.type==='Income');
const byMonth = (arr,m) => arr.filter(t=>t.date.startsWith(m));
const accounts = () => [...new Set(TX.map(t=>t.account))].sort();
const months = () => [...new Set(TX.map(t=>t.date.slice(0,7)))].sort();
const monthLabel = k => { const[y,m]=k.split('-'); return MN[m]+' '+y; };
const acctColor = name => ACCT_COLORS_MAP[name] || `hsl(${[210,160,280,40,330,80,190][[...name].reduce((h,c)=>(h*31+c.charCodeAt(0))&0xffff,0)%7]},65%,52%)`;
const acctGradient = name => ACCT_GRADIENTS[name] || `linear-gradient(135deg,${acctColor(name)}aa,${acctColor(name)})`;

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), 2800);
}

function destroyChart(id) {
  const el = document.getElementById(id);
  if(!el) return;
  const c = Chart.getChart(el);
  if(c) c.destroy();
}

const CHART_DEFAULTS = {
  color: '#9492a0', grid: 'rgba(255,255,255,0.04)',
  font: {'family':'JetBrains Mono','size':9},
  tooltip: (unit='') => ({ callbacks: { label: ctx => ' ' + fmt(ctx.raw) + unit } })
};

function mkChart(id, type, labels, datasets, opts={}) {
  destroyChart(id);
  const el = document.getElementById(id);
  if(!el) return null;
  return new Chart(el, {
    type, data: {labels, datasets},
    options: {
      responsive:true, maintainAspectRatio:false,
      plugins: { legend: opts.legend || {display:false}, tooltip: { callbacks: { label: ctx => ' '+fmt(ctx.raw) } } },
      scales: type!=='doughnut' && type!=='pie' ? {
        x: { grid:{display:false}, ticks:{color:CHART_DEFAULTS.color, font:CHART_DEFAULTS.font, ...(opts.xTicks||{})} },
        y: { grid:{color:CHART_DEFAULTS.grid}, ticks:{color:CHART_DEFAULTS.color, font:CHART_DEFAULTS.font, callback: v=>'₹'+Math.round(v/1000)+'k', ...(opts.yTicks||{})} }
      } : {},
      ...opts.extra
    }
  });
}

// ── NAVIGATION ──
function nav(page) {
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.sb-item').forEach(n=>n.classList.remove('active'));
  const pg = document.getElementById('page-'+page);
  if(pg) pg.classList.add('active');
  document.querySelectorAll('.sb-item').forEach(n=>{
    if(n.dataset.page===page) n.classList.add('active');
  });
  ACTIVE_PAGE = page;
  render(page);
}

// ── SIDEBAR ──
function renderSidebar() {
  const accts = accounts();
  const total = Object.values(BALANCES).reduce((s,v)=>s+v,0);
  const rows = accts.map(a=>`
    <div class="sb-bal-row">
      <div class="sb-bal-dot" style="background:${acctColor(a)}"></div>
      <div class="sb-bal-name">${a}</div>
      <div class="sb-bal-val">${fmtD(BALANCES[a]||0)}</div>
    </div>`).join('');
  document.getElementById('sb-bals').innerHTML = rows;
  document.getElementById('sb-total').textContent = fmtD(total);
}

// ── MASTER RENDER ──
function render(page) {
  switch(page) {
    case 'dashboard': renderDashboard(); break;
    case 'progress': renderProgress(); break;
    case 'split': renderSplit(); break;
    case 'bills': renderBills(); break;
    case 'debts': renderDebts(); break;
    case 'transactions': renderTransactions(); break;
    case 'account-report': renderAccountReport(); break;
    case 'import': renderImportLog(); break;
  }
}

// ── DASHBOARD ──
function renderDashboard() {
  const allExp = exp(); const allInc = inc();
  const totalExp = allExp.reduce((s,t)=>s+Math.abs(t.amount),0);
  const totalInc = allInc.reduce((s,t)=>s+t.amount,0);
  const net = totalInc - totalExp;
  const days = [...new Set(allExp.map(t=>t.date))].length || 1;
  const avgDay = totalExp/days;
  const ms = months();
  const curMonth = ms[ms.length-1]||'';
  const curExp = byMonth(exp(),curMonth).reduce((s,t)=>s+Math.abs(t.amount),0);
  const totalBal = Object.values(BALANCES).reduce((s,v)=>s+v,0);
  const dates = TX.map(t=>t.date).sort();

  // header
  document.getElementById('dash-period').textContent = ms.length>0 ? monthLabel(ms[0])+' – '+monthLabel(ms[ms.length-1]) : '';
  document.getElementById('dash-sub').textContent = `// ${TX.length} transactions · ${dates[0]||''} to ${dates[dates.length-1]||''}`;

  // account cards
  const acctGrid = document.getElementById('acct-cards');
  const accts = accounts();
  acctGrid.style.gridTemplateColumns = `repeat(${Math.min(accts.length,4)},1fr)`;
  acctGrid.innerHTML = accts.map(a=>`
    <div class="acct-card" style="${acctGradient(a)}" onclick="openAcctReport('${a}')" title="View ${a} report">
      <div class="acct-name">${a}</div>
      <div class="acct-bal">${fmtD(BALANCES[a]||0)}</div>
      <div class="acct-role">tap to view report</div>
      <div class="acct-edit" onclick="event.stopPropagation();editBalance('${a}')" style="position:absolute;bottom:12px;right:14px;opacity:0.35;font-size:9px">✎ edit</div>
    </div>`).join('');

  // summary cards
  document.getElementById('dash-cards').innerHTML = `
    <div class="card"><div class="card-label">All-time Expenses</div><div class="card-val neg">${fmt(totalExp)}</div><div class="card-sub">${allExp.length} debits</div></div>
    <div class="card"><div class="card-label">All-time Income</div><div class="card-val pos">${fmt(totalInc)}</div><div class="card-sub">excl. transfers</div></div>
    <div class="card"><div class="card-label">Net P&L</div><div class="card-val ${net>=0?'pos':'neg'}">${net>=0?'+':'−'}${fmt(Math.abs(net))}</div><div class="card-sub">${net>=0?'surplus':'deficit'}</div></div>
    <div class="card"><div class="card-label">Avg / Day</div><div class="card-val gold">${fmt(avgDay)}</div><div class="card-sub">${days} tracked days</div></div>
    <div class="card"><div class="card-label">This Month</div><div class="card-val neg">${fmt(curExp)}</div><div class="card-sub">${monthLabel(curMonth)||'—'}</div></div>
    <div class="card accent"><div class="card-label">Total Balance</div><div class="card-val pos">${fmt(totalBal)}</div><div class="card-sub">all accounts</div></div>
  `;

  // category pie
  const catMap={};
  allExp.forEach(t=>{catMap[t.category]=(catMap[t.category]||0)+Math.abs(t.amount);});
  const cats = Object.entries(catMap).sort((a,b)=>b[1]-a[1]).slice(0,10);
  mkChart('cat-pie','doughnut',cats.map(c=>c[0]),[{data:cats.map(c=>c[1]),backgroundColor:CAT_COLORS,borderWidth:2,borderColor:'#09090b'}],{
    legend:{display:true,position:'right',labels:{color:'#9492a0',font:{size:9,family:'JetBrains Mono'},boxWidth:8,padding:7}},
    extra:{cutout:'55%'}
  });

  // monthly bar
  const mInc = ms.map(m=>byMonth(inc(),m).reduce((s,t)=>s+t.amount,0));
  const mExp = ms.map(m=>byMonth(exp(),m).reduce((s,t)=>s+Math.abs(t.amount),0));
  mkChart('month-bar','bar',ms.map(monthLabel),[
    {label:'Income',data:mInc,backgroundColor:'rgba(34,197,94,0.65)',borderRadius:4,borderWidth:0},
    {label:'Expenses',data:mExp,backgroundColor:'rgba(239,68,68,0.65)',borderRadius:4,borderWidth:0}
  ],{legend:{display:true,labels:{color:'#9492a0',font:{size:10},boxWidth:9}}});

  // daily spending line — rolling 60 days
  const cutoff = new Date(); cutoff.setDate(cutoff.getDate()-60);
  const cutoffStr = cutoff.toISOString().slice(0,10);
  const dayMap={};
  allExp.filter(t=>t.date>=cutoffStr).forEach(t=>{dayMap[t.date]=(dayMap[t.date]||0)+Math.abs(t.amount);});
  const dayKeys = Object.keys(dayMap).sort();
  mkChart('daily-line','line',dayKeys.map(d=>d.slice(5)),[{
    data:dayKeys.map(d=>dayMap[d]),borderColor:'#7c6af5',borderWidth:1.5,

    </tr>`).join('');
}

// ── PROGRESS ──
function renderProgress() {
  const ms = months();
  let html = '';
  const netData = [];
  ms.forEach(m=>{
    const mExp=byMonth(exp(),m).reduce((s,t)=>s+Math.abs(t.amount),0);
    const mInc=byMonth(inc(),m).reduce((s,t)=>s+t.amount,0);
    const net=mInc-mExp;
    const cnt=TX.filter(t=>t.date.startsWith(m)).length;
    netData.push({month:monthLabel(m),inc:mInc,exp:mExp,net});
    html+=`<div class="prog-month">
      <div class="prog-month-head">
        <div class="prog-month-name">${monthLabel(m)}</div>
        <div class="prog-badges">
          <span class="badge ${net>=0?'badge-surplus':'badge-deficit'}">${net>=0?'SURPLUS':'DEFICIT'} ${net>=0?'+':''}${fmt(net)}</span>
          <span class="badge badge-neutral">${cnt} TX</span>
        </div>
      </div>
      <div class="prog-stats">
        <div class="prog-stat"><label>Income</label><span style="color:var(--green)">${fmt(mInc)}</span></div>
        <div class="prog-stat"><label>Expenses</label><span style="color:var(--red)">${fmt(mExp)}</span></div>
        <div class="prog-stat"><label>Net</label><span style="color:${net>=0?'var(--green)':'var(--red)'}">${net>=0?'+':''}${fmt(net)}</span></div>
      </div>
    </div>`;
  });
  document.getElementById('prog-months').innerHTML = html;

  mkChart('net-trend','bar',netData.map(d=>d.month),[
    {label:'Income',data:netData.map(d=>d.inc),backgroundColor:'rgba(34,197,94,0.65)',borderRadius:4,borderWidth:0},
    {label:'Expenses',data:netData.map(d=>d.exp),backgroundColor:'rgba(239,68,68,0.65)',borderRadius:4,borderWidth:0}
  ],{legend:{display:true,labels:{color:'#9492a0',font:{size:10},boxWidth:9}}});

  // cat compare — all months stacked
  const allCats=[...new Set(exp().map(t=>t.category))].filter(c=>c!=='TRANSFER');
  const datasets = ms.map((m,i)=>{
    const cMap={};
    byMonth(exp(),m).forEach(t=>{cMap[t.category]=(cMap[t.category]||0)+Math.abs(t.amount);});
    return {label:monthLabel(m),data:allCats.map(c=>cMap[c]||0),backgroundColor:CAT_COLORS[i%CAT_COLORS.length]+'aa',borderRadius:3,borderWidth:0};
  });
  mkChart('cat-compare','bar',allCats,datasets,{
    legend:{display:true,labels:{color:'#9492a0',font:{size:10},boxWidth:9}},
    extra:{indexAxis:'y'}
  });
}

// ── ACCOUNT SPLIT (FULLY DYNAMIC) ──
function renderSplit() {
  const accts = accounts();
  const total = Object.values(BALANCES).reduce((s,v)=>s+v,0);
  const ms = months();

  // compute avg monthly spend per account from actual data
  const acctSpend = {};
  accts.forEach(a=>{
    const months_with_data = [...new Set(exp().filter(t=>t.account===a).map(t=>t.date.slice(0,7)))];
    const totalSpend = exp().filter(t=>t.account===a).reduce((s,t)=>s+Math.abs(t.amount),0);
    acctSpend[a] = months_with_data.length>0 ? totalSpend/months_with_data.length : 0;
  });

  // find highest-income account (income account = HDFC)
  const acctIncome = {};
  accts.forEach(a=>{ acctIncome[a] = inc().filter(t=>t.account===a).reduce((s,t)=>s+t.amount,0); });
  const incomeAcct = Object.entries(acctIncome).sort((a,b)=>b[1]-a[1])[0]?.[0] || accts[0];

  // find account with highest interest (savings = Slice)
  const savingsAcct = accts.find(a=>a.toLowerCase().includes('slice')) || accts.find(a=>acctIncome[a]>0&&a!==incomeAcct) || '';

  // spending account = highest tx count, not income or savings
  const txCount = {};
  accts.forEach(a=>{txCount[a]=TX.filter(t=>t.account===a).length;});
  const spendAcct = accts.filter(a=>a!==incomeAcct&&a!==savingsAcct).sort((a,b)=>txCount[b]-txCount[a])[0] || '';

  // upcoming bills from BILLS state
  const upcomingBills = BILLS.filter(b=>!b.paid);
  const billsTotal = upcomingBills.reduce((s,b)=>s+b.amount,0);

  // outstanding debts you owe
  const debtTotal = DEBTS.owe.reduce((s,d)=>s+(d.total-d.paid),0);

  // smart recommendation: spending acct should have ~2x avg daily spend * days remaining this month
  const today = new Date();
  const daysInMonth = new Date(today.getFullYear(),today.getMonth()+1,0).getDate();
  const daysLeft = daysInMonth - today.getDate();
  const dailySpend = acctSpend[spendAcct]||0;
  const spendTarget = Math.round(dailySpend/30*daysLeft*1.2/100)*100; // 20% buffer, rounded to 100

  // income acct should keep bills + 10% buffer
  const incomeBuffer = Math.round((billsTotal*1.1)/100)*100;
  const incomeTarget = Math.max(incomeBuffer, 2000);

  // savings = everything else
  const savingsTarget = Math.max(0, total - spendTarget - incomeTarget);

  // current vs target
  const currentSpend = BALANCES[spendAcct]||0;
  const currentIncome = BALANCES[incomeAcct]||0;
  const currentSavings = BALANCES[savingsAcct]||0;

  const needsTopUp = spendAcct && currentSpend < spendTarget*0.5;
  const transferAmt = needsTopUp ? Math.max(0,spendTarget-currentSpend) : 0;

  // render
  let html = '';

  // current distribution bars
  html += `<div class="sec-div"><h2>Current Distribution</h2></div>`;
  accts.forEach(a=>{
    const bal = BALANCES[a]||0;
    const pct = total>0?Math.round(bal/total*100):0;
    const role = a===incomeAcct?'income account':a===savingsAcct?'savings account':a===spendAcct?'spending account':'account';
    html += `<div class="split-acct">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <div>
          <div style="font-size:12.5px;font-weight:500">${a}</div>
          <div style="font-size:10px;color:var(--text3);margin-top:1px">${role}</div>
        </div>
        <div style="text-align:right">
          <div style="font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:300;color:${acctColor(a)}">${fmtD(bal)}</div>
          <div style="font-size:10px;color:var(--text3)">${pct}% of total</div>
        </div>
      </div>
      <div class="split-bar-bg"><div class="split-bar" style="width:${pct}%;background:${acctColor(a)}"></div></div>
      <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--text3);margin-top:3px">
        <span>Avg spend/mo: ${fmt(acctSpend[a]||0)}</span>
        <span style="cursor:pointer;text-decoration:underline" onclick="editBalance('${a}')">✎ update balance</span>
      </div>
    </div>`;
  });

  // smart recommendation
  if(total > 0) {
    html += `<div class="sec-div"><h2>Smart Recommendation</h2></div>
    <div class="rec-box">
      <div class="rec-title">⊕ Suggested allocation based on your spending patterns</div>
      <div class="rec-body">
        Total: ${fmt(total)} · ${daysLeft} days left this month · ₹${fmt(billsTotal)} in upcoming bills
      </div>`;

    const targets = [
      [incomeAcct,'income','hold for bills & obligations',incomeTarget,'var(--hdfc)'],
      [spendAcct,'spending','daily expenses float',spendTarget,'var(--kotak)'],
      [savingsAcct,'savings','park & earn interest',savingsTarget,'var(--slice)'],
    ].filter(([a])=>a);

    targets.forEach(([a,role,reason,target,color])=>{
      const cur = BALANCES[a]||0;
      const diff = target - cur;
      const action = Math.abs(diff)<100?'✓ on target':diff>0?`→ add ${fmt(diff)}`:` → move ${fmt(Math.abs(diff))} out`;
      html += `<div class="tr-row">
        <span style="color:${color};font-weight:500">${a}</span>
        <span style="color:var(--text3)">·</span>
        <span style="color:var(--text2)">${reason}</span>
        <span style="margin-left:auto;color:var(--accent)">${fmt(target)}</span>
        <span style="color:${Math.abs(diff)<100?'var(--green)':diff>0?'var(--red)':'var(--gold)'};font-size:10px">${action}</span>
      </div>`;
    });
    html += '</div>';
  }

  // upcoming bills table
  if(upcomingBills.length>0) {
    html += `<div class="sec-div"><h2>Upcoming Bills (${fmt(billsTotal)} due)</h2></div>
    <div class="tbl-wrap"><div class="tbl-scroll"><table>
      <thead><tr><th>Bill</th><th>Due</th><th style="text-align:right">Amount</th></tr></thead>
      <tbody>
        ${upcomingBills.sort((a,b)=>a.date.localeCompare(b.date)).map(b=>`
          <tr><td>${b.name}</td><td class="mono">${b.date}</td><td class="neg">${fmt(b.amount)}</td></tr>`).join('')}
      </tbody>
    </table></div></div>`;
  }

  // debt summary
  if(debtTotal>0) {
    html += `<div class="sec-div"><h2>Outstanding Debts</h2></div>
    <div class="insights-grid">
      <div class="insight bad"><div class="insight-title">You Owe</div><div class="insight-body" style="font-size:18px;font-family:'JetBrains Mono',monospace;font-weight:300;color:var(--red)">${fmt(debtTotal)}</div></div>
      <div class="insight good"><div class="insight-title">Owed to You</div><div class="insight-body" style="font-size:18px;font-family:'JetBrains Mono',monospace;font-weight:300;color:var(--green)">${fmt(DEBTS.owed.reduce((s,d)=>s+(d.total-d.paid),0))}</div></div>
    </div>`;
  }

  document.getElementById('split-content').innerHTML = html;
}

// ── BILLS ──
function renderBills() {
  const today = new Date();
  const upcoming = BILLS.filter(b=>!b.paid).sort((a,b)=>a.date.localeCompare(b.date));
  const paid = BILLS.filter(b=>b.paid);
  const totalDue = upcoming.reduce((s,b)=>s+b.amount,0);

  document.getElementById('bills-summary').innerHTML = `
    <div class="card"><div class="card-label">Due This Month</div><div class="card-val neg">${fmt(totalDue)}</div><div class="card-sub">${upcoming.length} remaining</div></div>
    <div class="card"><div class="card-label">Paid</div><div class="card-val pos">${fmt(paid.reduce((s,b)=>s+b.amount,0))}</div><div class="card-sub">${paid.length} cleared</div></div>
    <div class="card"><div class="card-label">Total Bills</div><div class="card-val">${BILLS.length}</div><div class="card-sub">all time</div></div>
  `;

  let html = '';
  upcoming.forEach(b=>{
    const d = new Date(b.date);
    const diff = Math.ceil((d-today)/(864e5));
    const urgency = diff<=1?'urgent':diff<=7?'soon':'';
    const dotColor = diff<=1?'var(--red)':diff<=7?'var(--gold)':'var(--green)';
    const daysLabel = diff<0?`${Math.abs(diff)}d overdue`:diff===0?'Today':diff===1?'Tomorrow':`In ${diff} days`;
    html += `<div class="bill-item ${urgency}">
      <div style="display:flex;align-items:center;gap:10px">
        <div class="bill-dot" style="background:${dotColor}"></div>
        <div><div class="bill-name">${b.name}</div><div class="bill-meta">${b.date} · ${daysLabel}</div></div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <div class="bill-amt">${fmt(b.amount)}</div>
        <button class="btn btn-success" onclick="markBillPaid('${b.id}')">✓</button>
        <button class="btn btn-danger" onclick="delBill('${b.id}')">✕</button>
      </div>
    </div>`;
  });

  if(paid.length) {
    html += `<div class="sec-div"><h2>Paid</h2></div>`;
    paid.forEach(b=>{
      html += `<div class="bill-item done">
        <div style="display:flex;align-items:center;gap:10px">
          <div class="bill-dot" style="background:var(--green)"></div>
          <div><div class="bill-name" style="text-decoration:line-through">${b.name}</div><div class="bill-meta">${b.date}</div></div>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <div class="bill-amt" style="color:var(--green)">${fmt(b.amount)} ✓</div>
          <button class="btn btn-danger" onclick="delBill('${b.id}')">✕</button>
        </div>
      </div>`;
    });
  }
  document.getElementById('bills-list').innerHTML = html;
}

// ── DEBTS ──
function renderDebts() {
  const totalOwe = DEBTS.owe.reduce((s,d)=>s+(d.total-d.paid),0);
  const totalOwed = DEBTS.owed.reduce((s,d)=>s+(d.total-d.paid),0);
  document.getElementById('debts-summary').innerHTML = `
    <div class="card"><div class="card-label">You Owe</div><div class="card-val neg">${fmt(totalOwe)}</div><div class="card-sub">${DEBTS.owe.length} obligations</div></div>
    <div class="card"><div class="card-label">Owed to You</div><div class="card-val pos">${fmt(totalOwed)}</div><div class="card-sub">${DEBTS.owed.length} pending</div></div>
    <div class="card"><div class="card-label">Net Position</div><div class="card-val ${totalOwed-totalOwe>=0?'pos':'neg'}">${totalOwed-totalOwe>=0?'+':''}${fmt(totalOwed-totalOwe)}</div><div class="card-sub">${totalOwed>totalOwe?'net positive':'net negative'}</div></div>
  `;

  const mkDebtList = (list,type) => list.map(d=>{
    const rem = d.total-d.paid;
    const pct = d.total>0?Math.round(d.paid/d.total*100):0;
    return `<div class="debt-item">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px">
        <div><div class="debt-person">${d.person}</div>${d.note?`<div class="debt-note">${d.note}</div>`:''}${d.monthly?`<div class="debt-note">₹${d.monthly}/mo</div>`:''}</div>
        <div class="debt-amt ${type}">${fmt(rem)}</div>
      </div>
      <div class="debt-bar"><div class="debt-bar-fill" style="width:${pct}%;background:${type==='owe'?'var(--red)':'var(--green)'}"></div></div>
      <div style="display:flex;gap:6px;margin-top:8px">
        ${type==='owe'?`<button class="btn btn-ghost" style="font-size:10px;padding:4px 10px" onclick="logPayment('${d.id}')">Log payment</button>`:`<button class="btn btn-success" style="font-size:10px;padding:4px 10px" onclick="markReceived('${d.id}')">Received</button>`}
        <button class="btn btn-danger" style="font-size:10px;padding:4px 10px" onclick="rmDebt('${type}','${d.id}')">Remove</button>
      </div>
    </div>`;
  }).join('');

  document.getElementById('you-owe').innerHTML = mkDebtList(DEBTS.owe,'owe');
  document.getElementById('owed-you').innerHTML = mkDebtList(DEBTS.owed,'owed');
}

// ── TRANSACTIONS ──
function renderTransactions() {
  const acctFilter = document.getElementById('f-account').value;
  const typeFilter = document.getElementById('f-type').value;
  const monthFilter = document.getElementById('f-month').value;
  const search = document.getElementById('f-search').value.toLowerCase();

  // populate selects dynamically
  const acctSel = document.getElementById('f-account');
  const curAcct = acctSel.value;
  const acctOpts = accounts().map(a=>`<option ${a===curAcct?'selected':''}>${a}</option>`).join('');
  if(acctSel.innerHTML.indexOf(accounts()[0])<0) acctSel.innerHTML='<option value="">All Accounts</option>'+acctOpts;

  const monthSel = document.getElementById('f-month');
  const curMonth = monthSel.value;
  if(monthSel.innerHTML.indexOf(months()[0])<0)
    monthSel.innerHTML='<option value="">All Months</option>'+months().slice().reverse().map(m=>`<option value="${m}" ${m===curMonth?'selected':''}>${monthLabel(m)}</option>`).join('');

  let rows = TX.filter(t=>{
    if(acctFilter&&t.account!==acctFilter) return false;
    if(typeFilter&&t.type!==typeFilter) return false;
    if(monthFilter&&!t.date.startsWith(monthFilter)) return false;
    if(search&&!(t.note||'').toLowerCase().includes(search)&&!t.category.toLowerCase().includes(search)&&!t.account.toLowerCase().includes(search)) return false;
    return true;
  });

  document.getElementById('tx-count').textContent = rows.length+' records';
  document.getElementById('tx-tbody').innerHTML = rows.map(t=>`
    <tr>
      <td class="mono">${t.date}</td>
      <td><span class="pill" style="background:${acctColor(t.account)}22;color:${acctColor(t.account)}">${t.account}</span></td>
      <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)">${t.note||'—'}</td>
      <td style="color:var(--text3);font-size:10.5px">${t.category}</td>
      <td style="font-size:10.5px;color:${t.transfer?'var(--blue)':t.amount>0?'var(--green)':'var(--text3)'}">${t.transfer?'Transfer':t.type}</td>
      <td class="${t.transfer?'tr-amt':t.amount>0?'pos':'neg'}">${t.transfer?'⇄ ':(t.amount>0?'+':'−')}${fmtD(t.amount)}</td>
    </tr>`).join('');
}

// ── BILL ACTIONS ──
async function markBillPaid(id) {
  await sb?.from('bills').update({paid:true}).eq('id',id);
  const b=BILLS.find(b=>b.id===id); if(b){b.paid=true; renderBills(); toast(`${b.name} ✓`);}
}
async function delBill(id) {
  await sb?.from('bills').delete().eq('id',id);
  BILLS=BILLS.filter(b=>b.id!==id); renderBills(); toast('Removed');
}
async function addBill() {
  const name=document.getElementById('bill-name').value;
  const amt=parseFloat(document.getElementById('bill-amt').value);
  const date=document.getElementById('bill-date').value;
  if(!name||!amt||!date){toast('Fill all fields');return;}
  const {data,error}=await sb.from('bills').insert({name,amount:amt,due_date:date,paid:false}).select().single();
  if(error){toast('Error: '+error.message);return;}
  BILLS.push({id:data.id,name,amount:amt,date,paid:false});
  document.getElementById('bill-name').value='';document.getElementById('bill-amt').value='';document.getElementById('bill-date').value='';
  renderBills(); toast('Bill added ✓');
}

// ── DEBT ACTIONS ──
async function logPayment(id) {
  const amt=parseFloat(prompt('Amount paid (₹):'));
  if(isNaN(amt)||amt<=0) return;
  const d=DEBTS.owe.find(d=>d.id===id);
  if(d){d.paid=Math.min(d.total,d.paid+amt); await sb?.from('debts').update({paid:d.paid}).eq('id',id); renderDebts(); toast('Payment logged ✓');}
}
async function markReceived(id) {
  const d=DEBTS.owed.find(d=>d.id===id);
  if(d){d.paid=d.total; await sb?.from('debts').update({paid:d.total}).eq('id',id); renderDebts(); toast(`${d.person} ✓`);}
}
async function rmDebt(type,id) {
  await sb?.from('debts').delete().eq('id',id);
  DEBTS[type]=DEBTS[type].filter(d=>d.id!==id); renderDebts(); toast('Removed');
}
async function addDebt(type) {
  const person=prompt('Person:'); if(!person) return;
  const total=parseFloat(prompt('Amount (₹):')); if(isNaN(total)) return;
  const note=prompt('Note (optional):')||'';
  const {data,error}=await sb.from('debts').insert({direction:type,person,total,paid:0,monthly:0,note}).select().single();
  if(error){toast('Error: '+error.message);return;}
  DEBTS[type].push({id:data.id,person,total,paid:0,monthly:0,note});
  renderDebts(); toast('Added ✓');
}

// ── BALANCE EDIT ──
async function editBalance(account) {
  const val=parseFloat(prompt(`Current balance for ${account} (₹):`));
  if(isNaN(val)) return;
  BALANCES[account]=val;
  await sb?.from('balances').update({balance:val,updated_at:new Date().toISOString()}).eq('account',account);
  renderSidebar(); render(ACTIVE_PAGE); toast(`${account} updated`);
}

// ── CSV IMPORT ──
function handleFile(e){const f=e.target.files[0];if(f)readCSV(f);}
function handleDrop(e){e.preventDefault();document.getElementById('drop-zone').classList.remove('over');const f=e.dataTransfer.files[0];if(f)readCSV(f);}
async function readCSV(file){
  const reader=new FileReader();
  reader.onload=async e=>{
    const lines=e.target.result.trim().split('\n');
    const headers=lines[0].split(';').map(h=>h.trim());
    const newTx=[];
    for(let i=1;i<lines.length;i++){
      const vals=lines[i].split(';');const row={};
      headers.forEach((h,j)=>row[h]=vals[j]||'');
      if(!row.account) continue;
      newTx.push({date:row.date?.substring(0,10)||'',account:row.account,category:row.category||'',note:row.note||'',amount:parseFloat(row.amount)||0,type:row.type||'',transfer:row.transfer==='true'});
    }
    const existing=new Set(TX.map(t=>`${t.date}|${t.account}|${t.amount}|${t.note}`));
    const added=newTx.filter(t=>!existing.has(`${t.date}|${t.account}|${t.amount}|${t.note}`));
    if(!added.length){toast('No new transactions');return;}
    // detect new accounts
    const newAccts=[...new Set(added.map(t=>t.account))].filter(a=>!BALANCES[a]);
    for(const a of newAccts){
      BALANCES[a]=0;
      await sb?.from('balances').upsert({account:a,balance:0,role:'imported',updated_at:new Date().toISOString()},{onConflict:'account'});
      toast(`New account detected: ${a}`);
    }
    const {error}=await sb.from('transactions').insert(added);
    if(error){toast('DB error: '+error.message);return;}
    TX=[...added,...TX].sort((a,b)=>b.date.localeCompare(a.date));
    renderSidebar();
    // refresh month/account filters
    document.getElementById('f-month').innerHTML='<option value="">All Months</option>';
    document.getElementById('f-account').innerHTML='<option value="">All Accounts</option>';
    const logEl=document.getElementById('import-log');
    if(logEl) logEl.innerHTML+=`<div style="color:var(--green)">✓ ${file.name} — ${added.length} new (${new Date().toLocaleDateString()})</div>`;
    toast(`✓ ${added.length} transactions saved`);
    setTimeout(()=>render(ACTIVE_PAGE),300);
  };
  reader.readAsText(file);
}

  } else {
    const logEl = document.getElementById('import-log');
    if(logEl) logEl.innerHTML = `<div style="color:var(--gold)">⚡ Running offline with preloaded data (${TX.length} transactions)</div>`;
  }

  renderSidebar();
  // Wait one frame for DOM to settle after innerHTML injection
  requestAnimationFrame(() => requestAnimationFrame(() => renderDashboard()));
}

if(document.readyState==='complete') boot(); else window.addEventListener('load',boot);
</script>
</body>
</html>
